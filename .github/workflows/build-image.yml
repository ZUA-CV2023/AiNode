name: Build and push image to ACR

# 两种触发方式，版本号规则不同：
#   push 到 main        → v1.0.0-rc.43+<commit 短哈希>   日常开发
#   push tag  v1.0.0    → v1.0.0                        正式发布
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ainode
  # 上游基线版本。升级到新的 rc 时改这里。
  BASE_VERSION: v1.0.0-rc.43

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------------
      # 版本号有两个形态，不能混：
      #   app_version —— 写进 VERSION，编入二进制和前端，含 '+'
      #   tag_version —— Docker 镜像标签，只允许 [a-zA-Z0-9._-]，'+' 换成 '_'
      # ------------------------------------------------------------------
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            APP_VERSION="${GITHUB_REF#refs/tags/}"
          else
            APP_VERSION="${BASE_VERSION}+${GITHUB_SHA::7}"
          fi
          TAG_VERSION="${APP_VERSION//+/_}"

          # 前端 releases.ts 的解析正则，不匹配会导致版本显示异常
          if ! printf '%s' "$APP_VERSION" |
            grep -Eq '^v?[0-9]+(\.[0-9]+){2,}(-(alpha|beta|rc|patch)(\.[0-9]+)?)?(\+[0-9a-zA-Z.-]+)?$'; then
            echo "::error::version [$APP_VERSION] does not match the frontend parser"
            echo "::error::提示：tag 名需要形如 v1.2.3 或 v1.2.3-rc.1"
            exit 1
          fi

          printf '%s' "$APP_VERSION" > VERSION
          {
            echo "app_version=$APP_VERSION"
            echo "tag_version=$TAG_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "应用版本 : $APP_VERSION"
          echo "镜像标签 : $TAG_VERSION"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          # 国内加速：Dockerfile 里这两个 ARG 默认走上游源，这里覆盖成镜像站
          build-args: |
            GOPROXY=https://goproxy.cn,direct
            NPM_REGISTRY=https://registry.npmmirror.com
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag_version }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=AiNode
            org.opencontainers.image.version=${{ steps.version.outputs.app_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Summary
        run: |
          REG="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}"
          {
            echo "### 镜像已推送"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 应用版本 | \`${{ steps.version.outputs.app_version }}\` |"
            echo "| 镜像标签 | \`${{ steps.version.outputs.tag_version }}\` |"
            echo "| 完整地址 | \`${REG}:${{ steps.version.outputs.tag_version }}\` |"
            echo ""
            echo "#### 服务器更新（在 ECS 上执行）"
            echo '```bash'
            echo "docker login --username=<你的阿里云账号> ${{ secrets.ACR_REGISTRY }}"
            echo "docker pull ${REG}:${{ steps.version.outputs.tag_version }}"
            echo "docker compose up -d --no-deps --force-recreate new-api"
            echo '```'
            echo ""
            echo "验证：\`bash verify-deploy.sh ${{ steps.version.outputs.app_version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
